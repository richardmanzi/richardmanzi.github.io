<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://richardmanzi.github.io/" />
  <meta name="theme-color" content="#ffffff" />
  <title>Offline — Richard Manzi Portfolio</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Helvetica Neue", Arial, sans-serif; background: #fff; color: #000; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 38rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #d5d5d5; border-radius: 0; background: #fff; }
    .mark { color: #000; font-size: .8rem; font-weight: 500; letter-spacing: .12em; }
    h1 { margin: 2rem 0 .75rem; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 300; letter-spacing: -.06em; line-height: 1; }
    p { color: #666; line-height: 1.7; }
    a { display: inline-flex; min-height: 44px; align-items: center; margin-top: .75rem; padding: .65rem 1.25rem; border: 1px solid #000; border-radius: 75px; background: transparent; color: #000; font-weight: 400; text-decoration: none; }
    a:hover { background: #000; color: #fff; }
    a:focus-visible { outline: 2px solid #000; outline-offset: 4px; }
  </style>
  <link rel="stylesheet" href="glass.css?v=editorial-2026-11-03-r2" />
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">RICHARD MANZI</div>
    <h1>You’re offline.</h1>
    <p>The full portfolio can be opened offline on supported browsers after you have visited it online and let the page finish loading.</p>
    <p>Reconnect to the internet, then return to Richard’s portfolio.</p>
    <a href="/">Open the portfolio</a>
  </main>
</body>
</html>
