<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://richardmanzi.github.io/" />
  <meta name="theme-color" content="#f7f6f1" />
  <title>Offline — Richard Manzi Portfolio</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f6f1; color: #282a24; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 38rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid rgba(48, 49, 39, .12); border-radius: 1.5rem; background: rgba(255, 255, 255, .78); }
    .mark { color: #61752e; font-weight: 800; letter-spacing: -.06em; font-size: 1.4rem; }
    h1 { margin: 2rem 0 .75rem; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; }
    p { color: #63665d; line-height: 1.7; }
    a { display: inline-block; margin-top: .75rem; padding: .8rem 1.1rem; border-radius: 999px; background: #61752e; color: #fff; font-weight: 750; text-decoration: none; }
    a:focus-visible { outline: 3px solid #61752e; outline-offset: 3px; }
  </style>
  <link rel="stylesheet" href="glass.css" />
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">RM.</div>
    <h1>You’re offline.</h1>
    <p>The full portfolio can be opened offline on supported browsers after you have visited it online and let the page finish loading.</p>
    <p>Reconnect to the internet, then return to Richard’s portfolio.</p>
    <a href="/">Open the portfolio</a>
  </main>
</body>
</html>
